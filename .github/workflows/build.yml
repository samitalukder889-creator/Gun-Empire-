name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Cordova & Android Dependencies
      run: |
        npm install -g cordova
        cordova create gameapp com.cybershooter.proelite "Cyber Shooter Pro Elite"
        cd gameapp
        rm -rf www/*
        cp ../index.html www/
        cp ../style.css www/
        cp ../script.js www/
        cp ../config.xml .
        cordova platform add android
        cordova build android --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CyberShooter-ProElite-APK
        path: gameapp/platforms/android/app/build/outputs/apk/release/
        
